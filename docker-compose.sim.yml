# Code generated by ignition-gateway-harness peripheral simulation generator.
# Source of truth: Backups analysis from ./backups
# To spin up simulation services:
#   docker compose -f docker-compose.sim.yml up -d

services:
  sim-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sim-mssql
    hostname: sim-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Password123!}
      MSSQL_PID: Developer
      MSSQL_COLLATION: SQL_Latin1_General_CP1_CI_AS
    ports:
    - 1433:1433
    volumes:
    - sim_mssql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${MSSQL_SA_PASSWORD:-Password123!}"
        -C -Q "SELECT 1" || /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "password"
        -C -Q "SELECT 1" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "${MSSQL_SA_PASSWORD:-Password123!}"
        -Q "SELECT 1" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "password"
        -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      ignition_network:
        aliases:
        - db-dev-defignition-primary
        - db-dev-defignition-primary.oshkoshglobal.com
        - db-mock
        - db-prd-defignition-primary
        - db-prd-defignition-primary.oshkoshglobal.com
        - db-prd-defmestag1-primary
        - db-prd-defmestag1-primary.oshkoshglobal.com
        - db-prd-defmestag2-primary
        - db-prd-defmestag2-primary.oshkoshglobal.com
        - db-tst-defignition-primary
        - db-tst-defignition-primary.oshkoshglobal.com
        - db-tst-defmestag1-primary
        - db-tst-defmestag1-primary.oshkoshglobal.com
        - db-tst-defmestag2-primary
        - db-tst-defmestag2-primary.oshkoshglobal.com
        - mssql
        - sqlserver
  sim-db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sim-db-init
    hostname: sim-db-init
    restart: 'no'
    depends_on:
      sim-mssql:
        condition: service_healthy
    volumes:
    - ./sim_init/init-databases.sql:/init-databases.sql:ro
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Password123!}
    networks:
    - ignition_network
    entrypoint:
    - /bin/bash
    - -c
    - "set -e\necho \"[DB-INIT] Executing init-databases.sql against SQL Server instance\
      \ 'sim-mssql'...\"\nif [ -f /opt/mssql-tools18/bin/sqlcmd ]; then\n  /opt/mssql-tools18/bin/sqlcmd\
      \ -S sim-mssql -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -i /init-databases.sql\
      \ || \\\n  /opt/mssql-tools18/bin/sqlcmd -S sim-mssql -U sa -P \"password\"\
      \ -C -b -i /init-databases.sql\nelse\n  /opt/mssql-tools/bin/sqlcmd -S sim-mssql\
      \ -U sa -P \"$$MSSQL_SA_PASSWORD\" -b -i /init-databases.sql || \\\n  /opt/mssql-tools/bin/sqlcmd\
      \ -S sim-mssql -U sa -P \"password\" -b -i /init-databases.sql\nfi\necho \"\
      [DB-INIT] Databases and baseline tables initialized successfully.\"\n"
  sim-mailpit:
    image: axllent/mailpit:latest
    container_name: sim-mailpit
    hostname: sim-mailpit
    restart: unless-stopped
    ports:
    - 1025:1025
    - 8025:8025
    networks:
      ignition_network:
        aliases:
        - mailpit
        - smtp
        - smtp-mock
        - smtp.office365.com
        - smtp.oshkoshglobal.com
        - sszsmtp
        - sszsmtp.oshkoshglobal.com
  sim-mosquitto:
    image: eclipse-mosquitto:2
    container_name: sim-mosquitto
    hostname: sim-mosquitto
    restart: unless-stopped
    ports:
    - 1883:1883
    - 1885:1885
    volumes:
    - sim_mosquitto_data:/mosquitto/data
    - ./sim_init/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      ignition_network:
        aliases:
        - mosquitto
        - mqtt-mock
        - nadefaiutlp01
        - nadefaiutlp01.oshkoshglobal.com
        - nadefmitsdw01
        - nadefmitspw01
        - nadefscdapw08
        - nadefunsdpw01
  sim-opc-plc:
